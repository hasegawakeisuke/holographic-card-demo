<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ハンズのコーポレートグリーン。hands.net の theme-color と同値 -->
    <meta name="theme-color" content="#006b30" />
    <title>ハンズネットストアの商品をトレカっぽく表示するデモ</title>
    <meta
      name="description"
      content="スキャンコードを入力すると、ハンズネットストアの商品画像をポケモンカード風のホログラフィックカードとして表示します。"
    />
    <link rel="stylesheet" href="/styles/app.css" />
    <link rel="stylesheet" href="/styles/card.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>✨</text></svg>"
    />
  </head>
  <body>
    <div class="layout">
      <header class="site-header">
        <h1 class="site-title">ハンズネットストアの商品をトレカっぽく表示するデモ</h1>
        <p class="site-lead">
          スキャンコードを入力すると、ハンズネットストアの商品をポケモンカード風に加工して表示します。<br />
          カードにマウスを乗せる（スマホならなぞる）と光ります。
        </p>
      </header>

      <form class="finder" id="finder" novalidate>
        <div class="finder__field">
          <label class="visually-hidden" for="jan">スキャンコード</label>
          <input
            id="jan"
            name="jan"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="20"
            placeholder="4549917237131"
            aria-describedby="hint"
          />
        </div>
        <button type="submit" id="submit">カード生成</button>
        <p class="finder__hint" id="hint" role="status"></p>
      </form>

      <!--
        カテゴリが偏らないよう、7タイプにまたがる商品を選んでいる。
        並びは価格の安い順。最後のマキタ（32,780円）だけが secret に該当し、
        全面絵柄 + ex の見え方が確認できる。
      -->
      <p class="samples">
        おためし:
        <button type="button" data-jan="2401020170113">ハンドメイド</button>
        <button type="button" data-jan="4580821654713">パーティ</button>
        <button type="button" data-jan="4549917237131">バッグ</button>
        <button type="button" data-jan="4901478208973">文房具</button>
        <button type="button" data-jan="4901126238642">キッチン</button>
        <button type="button" data-jan="4515664068694">ビューティ</button>
        <button type="button" data-jan="4537988313526">アウトドア</button>
        <button type="button" data-jan="0088381833868">DIY・工具</button>
      </p>

      <main class="stage">
        <!-- カード本体。JS は中身のテキストと data 属性・CSS変数を差し替えるだけ -->
        <div
          class="card"
          id="card"
          data-rarity="common"
          data-layout="regular"
          data-type="colorless"
        >
          <div class="card__inner">
            <div class="card__face">
              <div class="card__header">
                <span class="card__stage" id="c-stage"></span>
                <h2 class="card__name" id="c-name">カードを生成してください</h2>
                <span class="card__ex" id="c-ex" hidden>ex</span>
                <span class="card__hp" id="c-hp"></span>
                <span class="card__type" id="c-type"></span>
              </div>

              <div class="card__window">
                <img class="card__image" id="c-image" alt="" hidden />
              </div>

              <div class="card__badges" id="c-badges"></div>

              <div class="card__attacks" id="c-attacks"></div>

              <div class="card__stats" id="c-stats"></div>

              <p class="card__flavor" id="c-flavor"></p>

              <div class="card__footer">
                <span class="card__stars" id="c-stars"></span>
                <span class="card__jan" id="c-jan"></span>
              </div>
            </div>

            <!--
              ホロ効果。順序に意味がある
              （multiply → color-dodge → 箔のパターン → glare）
              パターン層はレアリティごとに柄が変わる。コモンには柄が無い。
            -->
            <div class="card__shine"></div>
            <div class="card__shine card__shine--dodge"></div>
            <div class="card__pattern"></div>
            <div class="card__glare"></div>

            <div class="card__placeholder" id="c-placeholder">
              スキャンコードを入力すると<br />ここにカードが表示されます
            </div>
          </div>
        </div>

        <!--
          タッチ端末専用の案内。PC では CSS で非表示のまま。
          カードを傾ける操作はモーダルの中だけで行える。
        -->
        <p class="tap-hint" id="tap-hint">カードをタップすると拡大して傾けられます</p>

        <div class="thumbs" id="thumbs"></div>

        <!--
          カードの見た目の手動設定。既定は商品カテゴリと価格から自動で決まるが、
          「自動」以外を選ぶとユーザーの指定が優先される。選択内容は URL に載るので
          そのまま共有できる。
        -->
        <section class="controls" id="controls" hidden>
          <h2 class="controls__title">カードの設定</h2>
          <div class="controls__grid">
            <label class="control">
              <span class="control__label">タイプ</span>
              <select id="ctl-type" data-param="type">
                <option value="">自動（カテゴリから判定）</option>
              </select>
            </label>

            <label class="control">
              <span class="control__label">レアリティ</span>
              <select id="ctl-rarity" data-param="rarity">
                <option value="">自動（価格から判定）</option>
              </select>
            </label>

            <label class="control">
              <span class="control__label">レイアウト</span>
              <select id="ctl-layout" data-param="layout">
                <option value="">自動（UR以上は全面絵柄）</option>
                <option value="regular">通常（枠あり）</option>
                <option value="full-art">全面絵柄</option>
              </select>
            </label>

            <label class="control control--check">
              <input type="checkbox" id="ctl-ex" data-param="ex" />
              <span class="control__label">ex カードにする</span>
            </label>
          </div>
          <button type="button" class="controls__reset" id="ctl-reset">自動設定に戻す</button>
        </section>

        <dl class="meta" id="meta"></dl>
      </main>

      <footer class="site-footer">
        <p>
          商品情報・画像の著作権は
          <a href="https://hands.net/" target="_blank" rel="noopener noreferrer">ハンズ</a>
          および各メーカーに帰属します。個人利用・デモ目的のページです。<br />
          ホロ効果は
          <a
            href="https://github.com/simeydotme/pokemon-cards-css"
            target="_blank"
            rel="noopener noreferrer"
            >pokemon-cards-css</a
          >
          (GPL-3.0) を参考にしています。
        </p>
      </footer>
    </div>

    <!--
      カード拡大モーダル。タッチ端末でのみ開く。
      中身はページ内のカード要素そのものを移動させて入れる（複製しない）ので、
      表示中の内容やイベントがそのまま引き継がれる。
    -->
    <dialog class="card-modal" id="card-modal" aria-label="カードの拡大表示">
      <div class="card-modal__slot" id="card-modal-slot"></div>
      <button type="button" class="card-modal__close" id="card-modal-close">閉じる</button>
    </dialog>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
